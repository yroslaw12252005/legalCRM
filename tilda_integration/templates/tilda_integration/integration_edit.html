{% extends 'base.html' %}

{% block content %}
<div style="max-width:720px; margin:0 auto; padding:20px;">
  <div style="background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:20px;">
    <h2>Настройка «{{ integration.title }}»</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" style="border:0; border-radius:8px; padding:10px 15px; background:#2563eb; color:#fff;">Сохранить</button>
      <a href="{% url 'tilda_integration_list' %}" style="margin-left:10px;">Назад</a>
    </form>
  </div>
</div>
{% endblock content %}
