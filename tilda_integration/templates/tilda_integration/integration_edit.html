{% extends 'base.html' %}

{% block content %}
<div class="crm-form-page">
  <section class="crm-form-card">
    <header class="crm-form-header">
      <span class="crm-form-eyebrow">Интеграция с Tilda</span>
      <h1 class="crm-form-title">Настройка «{{ integration.title }}»</h1>
      <p class="crm-form-subtitle">Измените параметры подключения и правила обработки заявок.</p>
    </header>
    <form method="post" class="crm-form">
      {% csrf_token %}
      {{ form.as_p }}
      <div class="crm-form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'tilda_integration_list' %}" class="btn btn-outline-secondary">Назад</a>
      </div>
    </form>
  </section>
</div>
{% endblock content %}
