{% extends "base.html" %}

{% block content %}
{% if user.is_authenticated %}
<div class="crm-form-page crm-form-page--compact">
  <section class="crm-form-card">
    <header class="crm-form-header">
      <span class="crm-form-eyebrow">Задачи</span>
      <h1 class="crm-form-title">Новая задача</h1>
      <p class="crm-form-subtitle">Добавьте описание, срок и приоритет задачи.</p>
    </header>
    <form action="{% url 'add_task' %}" method="post" class="crm-form">
        {% csrf_token %}
        {{form.as_p}}
        <div class="crm-form-actions">
          <button type="submit" class="btn btn-primary">Создать задачу</button>
        </div>
    </form>
  </section>
</div>
{% endif%}
{% endblock content %}
