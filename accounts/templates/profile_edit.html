{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 640px; padding-top: 32px;">
    <h1>Мой профиль</h1>
    <p>Здесь можно изменить имя, email для входа и пароль.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
