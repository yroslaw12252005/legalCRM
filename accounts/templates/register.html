{% extends "base.html" %}


{% block content %}
<div class="crm-form-page crm-form-page--compact">
  <section class="crm-form-card">
    <header class="crm-form-header">
      <span class="crm-form-eyebrow">rossCRM</span>
      <h1 class="crm-form-title">Регистрация</h1>
      <p class="crm-form-subtitle">Создайте учётную запись для работы в системе.</p>
    </header>
	<form action="{% url 'register' %}" method="post" class="crm-form">
		{% csrf_token %}

		{% if form.errors %}
		<div class="alert alert-warning alert-dismissible fade show" role="alert">
			{% for field in form %}
				{% if field.errors %}
					{{ field.errors }}
				{% endif %}
			{% endfor %}
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>
	{% endif %}

		{{form.as_p}}

		<div class="crm-form-actions">
          <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
        </div>
	</form>
  </section>
</div>
{% endblock content %}
