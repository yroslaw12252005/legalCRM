{% extends "base.html" %}

{% block content %}
<div class="crm-form-page crm-form-page--compact">
    <section class="crm-form-card">
        <header class="crm-form-header">
          <span class="crm-form-eyebrow">Календарь</span>
          <h1 class="crm-form-title">Запись в офис</h1>
          <p class="crm-form-subtitle">Клиент: <strong>{{ record.name }}</strong> · заявка №{{ record.id }}</p>
        </header>
            <form method="post" class="crm-form">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="crm-form-actions">
                  <button type="submit" class="btn btn-primary">Сохранить</button>
                  <a href="{% url 'record' record.id %}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
    </section>
</div>
{% endblock content %}
