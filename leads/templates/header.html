{% load static %}
{% block content %}
{% if user.is_authenticated %}
<link rel="stylesheet" href="{% static 'css/header.css' %}" />

<style>
  .desktop-toolbar-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 12px;
    box-sizing: border-box;
  }
  .desktop-toolbar {
    margin: 0 0 12px 0;
    padding: 16px;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    background: #ffffff;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
  }
  .desktop-toolbar-form {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 10px;
    align-items: stretch;
  }
  .desktop-toolbar-input,
  .desktop-toolbar-select {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    background: #fff;
    color: #111827;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    min-height: 44px;
    box-sizing: border-box;
  }
  .desktop-toolbar-input {
    grid-column: span 2;
  }
  .desktop-toolbar-note {
    margin: 8px 2px 0 2px;
    font-size: 12px;
    color: #4b5563;
  }
  .desktop-toolbar-actions {
    margin-top: 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .crm-btn {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    color: #111827;
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    text-decoration: none;
  }
  .crm-btn-primary {
    background: #2563eb;
    border-color: #2563eb;
    color: #fff;
  }
  .crm-btn:hover {
    background: #eef2ff;
    transform: translateY(-1px);
  }
  .crm-btn-primary:hover {
    background: #1d4ed8;
    border-color: #1d4ed8;
  }
  @media (max-width: 767.98px) {
    .desktop-toolbar-wrap {
      padding: 0;
    }
    .desktop-toolbar {
      padding: 14px;
      border-radius: 14px;
    }
    .desktop-toolbar-form {
      grid-template-columns: 1fr;
    }
    .desktop-toolbar-input {
      grid-column: span 1;
    }
    .desktop-toolbar-input,
    .desktop-toolbar-select,
    .crm-btn {
      min-height: 42px;
    }
    .desktop-toolbar-note {
      font-size: 11px;
      margin-top: 10px;
    }
    .desktop-toolbar-actions {
      flex-direction: column;
    }
  }
</style>

<header class="crm-header-offset">
  <div class="desktop-toolbar-wrap">
    <div class="desktop-toolbar">
      <form method="get" action="{% url 'all_leads' %}" class="desktop-toolbar-form">
        <input
          class="desktop-toolbar-input"
          type="text"
          name="q"
          value="{{ search_query }}"
          placeholder="Поиск по имени, телефону, описанию, ID или № договора"
        >
        <select class="desktop-toolbar-select" name="operator">
          <option value="">Все операторы</option>
          <option value="unassigned" {% if selected_operator == "unassigned" %}selected{% endif %}>Не прикреплён оператор</option>
          {% for operator in operators %}
            <option value="{{ operator.username }}" {% if selected_operator == operator.username %}selected{% endif %}>
              {{ operator.username }}
            </option>
          {% endfor %}
        </select>
        <select class="desktop-toolbar-select" name="lawyer_upp">
          <option value="">Все юристы ЮПП</option>
          <option value="unassigned" {% if selected_lawyer_upp == "unassigned" %}selected{% endif %}>Не прикреплён юрист ЮПП</option>
          {% for lawyer in lawyers %}
            <option value="{{ lawyer.username }}" {% if selected_lawyer_upp == lawyer.username %}selected{% endif %}>
              {{ lawyer.username }}
            </option>
          {% endfor %}
        </select>
        <select class="desktop-toolbar-select" name="lawyer_op">
          <option value="">Все юристы ОП</option>
          <option value="unassigned" {% if selected_lawyer_op == "unassigned" %}selected{% endif %}>Не прикреплён юрист ОП</option>
          {% for representative in representatives %}
            <option value="{{ representative.username }}" {% if selected_lawyer_op == representative.username %}selected{% endif %}>
              {{ representative.username }}
            </option>
          {% endfor %}
        </select>
        <select class="desktop-toolbar-select" name="topic">
          <option value="">Все тематики</option>
          {% for topic in topics %}
            <option value="{{ topic }}" {% if selected_topic == topic %}selected{% endif %}>{{ topic }}</option>
          {% endfor %}
        </select>
        <select class="desktop-toolbar-select" name="status">
          <option value="">Статус заявки</option>
          {% for status_value, status_label in filter_status_choices %}
            <option value="{{ status_value }}" {% if selected_status == status_value %}selected{% endif %}>{{ status_label }}</option>
          {% endfor %}
        </select>
        <select class="desktop-toolbar-select" name="source">
          <option value="">Все источники</option>
          {% for source in sources %}
            <option value="{{ source }}" {% if selected_source == source %}selected{% endif %}>{{ source }}</option>
          {% endfor %}
        </select>
        <button type="submit" class="crm-btn crm-btn-primary">Применить</button>
        <a href="{% url 'all_leads' %}" class="crm-btn">Сбросить</a>
      </form>
      <p class="desktop-toolbar-note">Фильтры работают вместе: поиск, оператор, юрист ЮПП, юрист ОП, тематика, статус и источник.</p>
      {% if user.status == "Администратор" %}
      <div class="desktop-toolbar-actions">
        <a href="{% url 'import_records_from_excel' %}" class="crm-btn">Загрузить заявки из Excel</a>
      </div>
      {% endif %}
    </div>
  </div>
</header>

{% endif %}
{% endblock content %}
