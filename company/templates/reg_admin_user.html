{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учётная запись администратора — rossCRM</title>
  <link rel="icon" type="image/jpeg" href="{% static 'img/logorossCRM.jpg' %}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-aFq/bzH65dt+w6FI2ooMVUpc+21e0SRygnTpmBvdBgSdnuTN7QbdgL+OapgHtvPp" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
</head>
<body class="crm-auth-page">
  <main class="crm-form-page crm-form-page--compact">
    <section class="crm-form-card">
      <header class="crm-form-header">
        <span class="crm-form-eyebrow">Администратор</span>
        <h1 class="crm-form-title">Создание учётной записи</h1>
        <p class="crm-form-subtitle">Укажите данные администратора компании для входа в rossCRM.</p>
      </header>
      <form action="{% url 'reg_admin_user' id_company %}" class="crm-form" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="crm-form-actions">
          <button type="submit" class="btn btn-primary">Создать учётную запись</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
