{% extends "base.html" %}
{% block content %}
<div style="display:flex; justify-content:center; padding:40px 16px;">
  <div class="pole" style="width:100%; max-width:520px;">
    <h3>{{ page_title }}</h3>
    <p>Клиент: <strong>{{ record }}</strong></p>
    <form method="post" class="form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-success">Сохранить</button>
      <a href="{% url 'record' record.id %}" class="btn btn-secondary">Отмена</a>
    </form>
  </div>
</div>
{% endblock content %}
