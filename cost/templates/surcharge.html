{% extends "base.html" %}

{% block content %}
<div class="crm-form-page crm-form-page--compact">
  <section class="crm-form-card">
    <header class="crm-form-header">
      <span class="crm-form-eyebrow">Договор №{{ contract.number }}</span>
      <h1 class="crm-form-title">Новая доплата</h1>
      <p class="crm-form-subtitle">Клиент: <strong>{{ record }}</strong></p>
    </header>
 <form method="post" class="crm-form">
                {% csrf_token %}
                {{surcharge_form.as_p}}
                <div class="crm-form-actions">
                  <button type="submit" class="btn btn-primary">Сохранить доплату</button>
                </div>
 </form>
  </section>
</div>
{% endblock content %}
